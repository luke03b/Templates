# CI: per ogni template esegue lint, test e build, poi verifica che l'immagine Docker si costruisca.
# Ogni job parte solo se è cambiato qualcosa nella cartella del template (o in questo file).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Rileva i template modificati
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            flutter-template: ['flutter-template/**', '.github/workflows/ci.yml']
            angular-template: ['angular-template/**', '.github/workflows/ci.yml']
            react-template: ['react-template/**', '.github/workflows/ci.yml']
            csharp-frontend-template: ['csharp-frontend-template/**', '.github/workflows/ci.yml']
            java-backend-template: ['java-backend-template/**', '.github/workflows/ci.yml']
            python-backend-template: ['python-backend-template/**', '.github/workflows/ci.yml']
            dotnet-backend-template: ['dotnet-backend-template/**', '.github/workflows/ci.yml']
            typescript-backend-template: ['typescript-backend-template/**', '.github/workflows/ci.yml']
            nodejs-backend-template: ['nodejs-backend-template/**', '.github/workflows/ci.yml']

  # ------------------------------------------------------------------ frontend
  flutter:
    needs: changes
    if: contains(needs.changes.outputs.templates, '"flutter-template"')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: flutter-template } }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  angular:
    needs: changes
    if: contains(needs.changes.outputs.templates, '"angular-template"')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: angular-template } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: angular-template/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  react:
    needs: changes
    if: contains(needs.changes.outputs.templates, '"react-template"')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: react-template } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: react-template/.nvmrc
          cache: npm
          cache-dependency-path: react-template/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  csharp-frontend:
    needs: changes
    if: contains(needs.changes.outputs.templates, '"csharp-frontend-template"')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: csharp-frontend-template } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: csharp-frontend-template/global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  # ------------------------------------------------------------------- backend
  java-backend:
    needs: changes
    if: contains(needs.changes.outputs.templates, '"java-backend-template"')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: java-backend-template } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify

  python-backend:
    needs: changes
    if: contains(needs.changes.outputs.templates, '"python-backend-template"')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python-backend-template } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: python-backend-template/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov

  dotnet-backend:
    needs: changes
    if: contains(needs.changes.outputs.templates, '"dotnet-backend-template"')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dotnet-backend-template } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: dotnet-backend-template/global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  typescript-backend:
    needs: changes
    if: contains(needs.changes.outputs.templates, '"typescript-backend-template"')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: typescript-backend-template } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript-backend-template/.nvmrc
          cache: npm
          cache-dependency-path: typescript-backend-template/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  nodejs-backend:
    needs: changes
    if: contains(needs.changes.outputs.templates, '"nodejs-backend-template"')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nodejs-backend-template } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: nodejs-backend-template/.nvmrc
          cache: npm
          cache-dependency-path: nodejs-backend-template/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run coverage

  # -------------------------------------------------------------------- docker
  docker:
    name: Docker build (${{ matrix.template }})
    needs: changes
    if: needs.changes.outputs.templates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ${{ matrix.template }}:ci ${{ matrix.template }}
