<!doctype html>
<!-- Pagina host della SPA: Angular monta l'app dentro <app-root>. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Angular Template</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Angular + Angular Material starter template" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Font Roboto e icone Material Symbols (aggiunti da `ng add @angular/material`). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>This application requires JavaScript.</noscript>
  </body>
</html>
