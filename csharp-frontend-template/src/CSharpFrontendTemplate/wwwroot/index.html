<!DOCTYPE html>
<!--
  index.html: unica pagina HTML dell'app (Single Page Application). Il browser scarica
  blazor.webassembly.js, che avvia il runtime .NET in WebAssembly e monta il componente App in #app.
  I segnaposto #[.{fingerprint}] e l'importmap vengono riempiti in build (OverrideHtmlAssetPlaceholders).
-->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blazor WebAssembly frontend template" />
  <title>CSharp Frontend Template</title>
  <base href="/" />
  <link rel="preload" id="webassembly" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <!-- CSS "scoped" dei componenti e dei pacchetti (es. QuickGrid), generato in build. -->
  <link rel="stylesheet" href="CSharpFrontendTemplate#[.{fingerprint}].styles.css" />
  <script type="importmap"></script>
</head>

<body>
  <div id="app">
    <div class="app-loading" role="status">
      <span class="spinner spinner-lg"></span>
      <span>Loading application...</span>
    </div>
  </div>

  <!-- Mostrato da Blazor in caso di eccezione non gestita. -->
  <div id="blazor-error-ui" role="alert">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <button type="button" class="dismiss" aria-label="Dismiss">&times;</button>
  </div>
  <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
